name: Update news
on:
  schedule:
    - cron: "0 10,14,19,0 * * *"   # 4x a day: 6 AM, 10 AM, 3 PM, 8 PM Eastern (EDT); one hour later in winter
  workflow_dispatch:           # adds a "Run workflow" button for manual refreshes
permissions:
  contents: write
concurrency:
  group: update-news          # never let two runs overlap
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_news.py
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}            # empty = gemini; or groq / openrouter / cerebras / mistral / none
          AI_MODEL: ${{ vars.AI_MODEL }}                  # optional override
          AI_API_KEY: ${{ secrets.AI_API_KEY }}           # free key from the provider (see README step 4)
      - name: Commit new stories
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news $(date -u +%F)"
          # if anything else was pushed while this ran, rebase on top of it (keeping this run's news.json)
          git pull --rebase -X theirs origin main
          git push
